<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Letter</title>
</head>
<body>
    
    <script>
         let a=prompt("Enter any String");
 for(i=0;i<a.length;i++){
    document.write(a.charAt(i)+"<br>");
 }
    </script>
</body>
</html>
