<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>
<body>
    <script>
            let sum = 0, sum1 = 0, count = 0;
      var arr = [1, 2, 3, 4, 5, -1, -2];

     for (i = 0; i < arr.length; i++) {
    if (arr[i] > 0) {
        sum = sum + arr[i];
    }
    else if (arr[i] < 0) {
        sum1 = sum1 - arr[i];
    }
    else {
        count++;
    }
}
 console.log("pos" + sum + " neg" + sum1 + " zeros" + count);
    </script>
    
</body>
</html>
