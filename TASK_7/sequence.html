<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence</title>
</head>
<body>

    <script>
    // 5 10 15 20 25 ... 100

    let a = 5;

    do {
        document.write(a + " ");
        a = a + 5;
    }
    while(a <= 100);
</script>
</body>
</html>
