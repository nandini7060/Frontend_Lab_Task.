<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odd_even</title>
</head>
<body>
    <script>
         let sum_e=0,sum_o=0;
 var arr=[5,6,7,2,3,8];
 for(i=0;i<arr.length;i++){
    if(arr[i]%2==0){
        sum_e=sum_e+arr[i];
    }
    else{
        sum_o=sum_o+arr[i];
    }
 }
console.log("even sum"+sum_e+"odd_sum"+sum_o);
    </script>
    
</body>
</html>
