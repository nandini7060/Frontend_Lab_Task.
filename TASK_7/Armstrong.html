<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armstrong Number</title>
</head>
<body>
    <script>
          for( i=100;i<=319;i++){
            let a=i,sum=0;
            while(a!=0){
                sum+=Math.pow((a%10),3);
                a=Math.floor(a/10);
            }
            if(sum==i)console.log(i+" ");

        }
    </script>
</body>
</html>
