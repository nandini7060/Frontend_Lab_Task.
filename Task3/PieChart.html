
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PieChart</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid rgb(38, 36, 36);
            background-image: conic-gradient(rgb(255, 0, 136) 0deg 100deg, rgba(255, 255, 0, 0.448) 70deg 180deg, rgba(0, 128, 0, 0.738) 70deg 270deg, rgba(0, 0, 255, 0.59) 300deg 360deg);
            
        }  
        h1{
            color:black;
            position:relative;
            bottom: 130px;
            left:10px;

        }
        h2{
            color:black;
             position:relative;
            bottom: 180px;
            left:130px;

        }
        h3{
             color:black;
             position:relative;
            bottom: 290px;
            left:110px;
        }
          h4{
             color:black;
             position:relative;
            bottom: 330px;
            left:30px;
        }
       
    </style>
</head>
<body>
    <div class="box conic"></div>
    <h1>Rice</h1>
    <h2>Water</h2>
    <h3>Vegetable</h3>
     <h4 >Spice</h4>
</body>
</html>
