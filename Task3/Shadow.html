<!DOCTYPE html>
<html>
<head>
    <title>Shadow Properties</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .box {
            width: 200px;
            height: 120px;
            background-color: rgb(230, 179, 173);
            margin: 90px auto;
            padding: 20px;
        }

        /* Box Shadow */
        .box-shadow {
            box-shadow: 10px 10px 5px gray;
        }

        /* Text Shadow */
        .text-shadow h2 {
            text-shadow: 3px 3px 3px rgb(36, 126, 210);
        }
    </style>
</head>

<body>

    <h1>CSS Shadow Properties</h1>

    <div class="box box-shadow">
        <h2>Box Shadow</h2>
    </div>

    <div class="box text-shadow">
        <h2>Text Shadow</h2>
    </div>

</body>
</html>
